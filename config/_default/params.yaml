 # ══════════════════════════════════════════════════════════════════════════════
# HUGO BLOX CONFIGURATION
# Schema: hugoblox.com/schema/v2
# Tutorial: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# ══════════════════════════════════════════════════════════════════════════════
hugoblox:
  schema: "2.0"

  # ────────────────────────────────────────────────────────────────────────────
  # IDENTITY
  # Site-level branding (for people/profiles, use the author system in content/authors/)
  # ────────────────────────────────────────────────────────────────────────────
  identity:
    # Site name - shown in navbar, footer, copyright, and browser title by default
    name: "Lucia C. Passaro"
    # Legal entity for copyright notices (defaults to name if not set)
    organization: ""
    # Schema.org type for structured data
    type: person # person | organization | local_business
    # Short tagline displayed on your site
    tagline: "NLP researcher"
    # Site meta description for search engines and social sharing
    
  # ────────────────────────────────────────────────────────────────────────────
  # THEME
  # Color and visual design system
  # ────────────────────────────────────────────────────────────────────────────
  theme:
    # Mode: 'light', 'dark', or 'system' (follows OS preference)
    mode: system
    # Theme pack: name from data/themes/ or { light: "x", dark: "y" } for mix-and-match
    pack: "default"
    # Optional: Override theme pack colors
    colors:
      primary: "" # Tailwind palette name or hex (e.g., "indigo" or "#6366f1")
      secondary: ""
      neutral: "" # Affects gray utilities (text-gray-*, bg-gray-*)
    # Optional: Mode-specific color overrides
    colors_light: {}
    colors_dark: {}
    # Optional: Semantic surface color overrides
    surfaces:
      background: ""
      foreground: ""
      header:
        background: ""
        foreground: ""
      footer:
        background: ""
        foreground: ""

  # ────────────────────────────────────────────────────────────────────────────
  # TYPOGRAPHY
  # Font and text sizing
  # ────────────────────────────────────────────────────────────────────────────
  typography:
    # Theme pack: name from data/fonts/
    pack: "academic"

  # ────────────────────────────────────────────────────────────────────────────
  # LAYOUT
  # Spacing and shape tokens
  # ────────────────────────────────────────────────────────────────────────────
  layout:
    # Border radius: 'none', 'sm', 'md', 'lg', or 'full'
    radius: "md"
    # Spacing density: 'compact', 'comfortable', or 'spacious'
    spacing: "spacious"
    # Avatar shape in author profiles
    avatar_shape: circle # circle | square | rounded

  # ────────────────────────────────────────────────────────────────────────────
  # HEADER
  # Site header and navigation bar
  # ────────────────────────────────────────────────────────────────────────────
  header:
    enable: true
    # Header style variant
    style: navbar # navbar | navbar-simple | minimal
    # Stick to top on scroll
    sticky: true
    # Menu alignment
    align: center # left | center | right
    # Feature toggles
    search: true
    theme_toggle: true
    theme_picker: true
    language_switcher: true
    # Call-to-action button
    cta:
      enable: false
      text: ""
      url: ""

  # ────────────────────────────────────────────────────────────────────────────
  # FOOTER
  # Site footer
  # ────────────────────────────────────────────────────────────────────────────
  # ────────────────────────────────────────────────────────────────────────────

  footer:
    style: minimal
    language_switcher: false
    text: >
      <div class="footer-profiles">
        <a class="footer-link" href="https://scholar.google.com/citations?user=rfXtuFgAAAAJ" target="_blank" rel="noopener">
          <img class="footer-icon" src="/media/icons/google-scholar.png" alt="" aria-hidden="true">
          <span>Google Scholar</span>
        </a>

        <a class="footer-link" href="https://dblp.org/pid/184/8925.html" target="_blank" rel="noopener">
          <img class="footer-icon" src="/media/icons/dblp.png" alt="" aria-hidden="true">
          <span>DBLP</span>
        </a>

        <a class="footer-link" href="https://orcid.org/0000-0003-4934-5344" target="_blank" rel="noopener">
          <img class="footer-icon" src="/media/icons/orcid.png" alt="" aria-hidden="true">
          <span>ORCID</span>
        </a>

        <a class="footer-link" href="https://aclanthology.org/people/lucia-c-passaro/" target="_blank" rel="noopener">
          <img class="footer-icon" src="/media/icons/acl.png" alt="" aria-hidden="true">
          <span>ACL Anthology</span>
        </a>

        <a class="footer-link" href="https://github.com/luciacpassaro" target="_blank" rel="noopener">
          <img class="footer-icon" src="/media/icons/github.svg" alt="" aria-hidden="true">
          <span>GitHub</span>
        </a>

        <a class="footer-link" href="https://www.linkedin.com/in/lucia-passaro-49a5b637/" target="_blank" rel="noopener">
          <img class="footer-icon" src="/media/icons/linkedin.png" alt="" aria-hidden="true">
          <span>LinkedIn</span>
        </a>

        <a class="footer-link" href="https://huggingface.co/luciacpassaro" target="_blank" rel="noopener">
          <img class="footer-icon" src="/media/icons/huggingface.png" alt="" aria-hidden="true">
          <span>Hugging Face</span>
        </a>
      </div> 
  copyright:
    notice: "© {year} Lucia C. Passaro"
    license:
      type: custom

  # ────────────────────────────────────────────────────────────────────────────
  # SEO
  # Search engine optimization - overrides and technical settings
  # ────────────────────────────────────────────────────────────────────────────
  seo:
    # Browser tab title override (defaults to identity.name if not set)
    title: ""
    # For local_business identity type only
    location:
      address:
        street: ""
        city: ""
        region: ""
        postal_code: ""
        country: ""
      coordinates:
        latitude: null
        longitude: null
      phone: ""
    # AI/LLM crawler guidance (llms.txt)
    ai:
      allow:
        - /
      disallow: []
      note: "Guidance for AI crawlers - customize to match your public content."
      contact: ""

  # ────────────────────────────────────────────────────────────────────────────
  # CONTENT
  # Content rendering and behavior
  # ────────────────────────────────────────────────────────────────────────────
  content:
    # Math rendering
    math:
      enable: false
    # Table of contents
    toc:
      enable: true
    # Reading time estimates
    reading_time:
      enable: true
    # Academic citations
    citations:
      style: apa # apa | mla | chicago | ieee

  # ────────────────────────────────────────────────────────────────────────────
  # SEARCH
  # Site search
  # ────────────────────────────────────────────────────────────────────────────
  search:
    enable: false
    suggestions: []
    quick_actions: []

  # ────────────────────────────────────────────────────────────────────────────
  # COMMENTS
  # User comments system
  # ────────────────────────────────────────────────────────────────────────────
  comments:
    enable: false
    provider: "" # giscus | disqus
    giscus:
      repo: ""
      repo_id: ""
      category: ""
      category_id: ""
    disqus:
      shortname: ""

  # ────────────────────────────────────────────────────────────────────────────
  # ANALYTICS
  # Traffic and behavior analytics
  # ────────────────────────────────────────────────────────────────────────────
  analytics:
    google:
      measurement_id: "" # Google Analytics 4: G-XXXXXXXXXX
    google_tag_manager:
      container_id: "" # GTM-XXXXXXX
    plausible:
      domain: ""
    fathom:
      site_id: ""
    pirsch:
      site_id: ""
    clarity:
      project_id: ""
    baidu:
      site_id: ""

  # ────────────────────────────────────────────────────────────────────────────
  # VERIFICATION
  # Search engine site verification codes
  # ────────────────────────────────────────────────────────────────────────────
  verification:
    google: ""
    bing: ""
    baidu: ""
    yandex: ""
    pinterest: ""
    naver: ""

  # ────────────────────────────────────────────────────────────────────────────
  # REPOSITORY
  # Source code repository for "Edit this page" links
  # ────────────────────────────────────────────────────────────────────────────
  repository:
    enable: false
    url: "" # e.g., https://github.com/username/repo
    branch: main
    content_dir: content

  # ────────────────────────────────────────────────────────────────────────────
  # LOCALE
  # Regional formatting preferences
  # ────────────────────────────────────────────────────────────────────────────
  locale:
    date_format: "Jan 2, 2006" # Go time format
    time_format: "3:04 PM"
    address_format: en-us

  # ────────────────────────────────────────────────────────────────────────────
  # SECURITY
  # Security headers and policies (requires Netlify integration)
  # ────────────────────────────────────────────────────────────────────────────
  security:
    csp:
      policy: ""
      report_only: false
    frame_options: allow # deny | sameorigin | allow - allow enables iframe embedding
    permissions_policy: ""

  # ────────────────────────────────────────────────────────────────────────────
  # PRIVACY
  # Privacy and compliance features
  # ────────────────────────────────────────────────────────────────────────────
  privacy:
    enable: false
    anonymize_analytics: true

  # ────────────────────────────────────────────────────────────────────────────
  # DEBUG
  # Development and debugging (hidden in production)
  # ────────────────────────────────────────────────────────────────────────────
  debug:
    enable: false
    hud:
      position: bottom-left # top-left | top-right | bottom-left | bottom-right
      opacity: 1.0
    export_logs: true

  # ────────────────────────────────────────────────────────────────────────────
  # PREMIUM
  # Premium features and creator program (affiliates)
  # ────────────────────────────────────────────────────────────────────────────
  pro:
    # Hide "Powered by HugoBlox" attribution
    # Requires: HugoBlox Premium to support HugoBlox via alternative means
    # Note: Even with Premium, you can keep this false to support open source!
    # Get Premium: https://hugoblox.com/premium
    hide_attribution: false

    # Affiliate referral code for rewards program
    # Join affiliate program: https://hugoblox.com/affiliates
    affiliate_code: ""
    
features:
  custom_css:
    - css/custom.css