name: Import publications

on:
  push:
    paths:
      - "publications.bib"
      - "scripts/import_publications.py"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  import-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bibtexparser

      - name: Generate publication pages
        run: |
          python scripts/import_publications.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update publications from BibTeX"
          title: "Update publications"
          body: |
            This pull request updates the generated publication pages from `publications.bib`.

            Please review the generated files before merging.
          branch: update-publications
          delete-branch: true